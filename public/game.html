<!DOCTYPE html>
<html>
<head>
  <title>Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    gap: 20px;
  }

  .game-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .sidebar {
    width: 280px;
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 10px;
    height: fit-content;
  }

  .sidebar h2 {
    font-size: 1.3em;
    margin-bottom: 15px;
    color: #74c0fc;
  }

  .leaderboard-table {
    width: 100%;
    font-size: 0.85em;
  }

  .leaderboard-table th, .leaderboard-table td {
    padding: 6px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }

  .leaderboard-table th {
    background: rgba(255,255,255,0.1);
    font-weight: bold;
  }

  .leaderboard-table tr:hover {
    background: rgba(255,255,255,0.05);
  }

  .rank { font-weight: bold; }
  .rank-1 { color: #ffd700; }
  .rank-2 { color: #c0c0c0; }
  .rank-3 { color: #cd7f32; }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; }
  }

  #players {
    margin-bottom: 10px;
    font-size: 1.2em;
  }

  #status {
    margin-bottom: 20px;
    font-size: 1.6em;
  }

  #gameIdDisplay {
    margin-bottom: 10px;
    font-size: 3em;
    opacity: 0.9;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
    justify-content: center;
    margin: 20px auto;
  }

  .grid button {
    height: 100px;
    width: 100px;
    font-size: 2em;
    border: none;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    transition: 0.2s;
  }

  .win {
    animation: crazyWin 0.5s infinite alternate,
               glow 0.8s infinite alternate;
  }

  @keyframes crazyWin {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.3) rotate(8deg); }
    100% { transform: scale(1.2) rotate(-8deg); }
  }

  @keyframes glow {
    from { box-shadow: 0 0 10px #51cf66; }
    to { box-shadow: 0 0 40px #69db7c, 0 0 80px #8ce99a; }
  }

  .shake {
    animation: shake 0.4s;
  }

  @keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(5px,-5px); }
    50% { transform: translate(-5px,5px); }
    75% { transform: translate(5px,5px); }
    100% { transform: translate(0,0); }
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: red;
    top: -10px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }

  .sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: gold;
    border-radius: 50%;
    animation: explode 1s forwards;
  }

  @keyframes explode {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.2); }
  }

  .lose {
    animation: die 0.8s forwards, bloodPulse 1s infinite alternate;
  }

  @keyframes die {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    50%  { transform: scale(1.1) rotate(-5deg); }
    100% { transform: scale(0.6) rotate(-15deg); opacity: 0.4; }
  }

  @keyframes bloodPulse {
    from { box-shadow: 0 0 5px #ff0000; }
    to   { box-shadow: 0 0 25px #8b0000; }
  }

  .emoji {
    position: absolute;
    font-size: 24px;
    pointer-events: none;
    animation: floatUp 1.5s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 1;
      transform: translate(0,0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--x), var(--y)) scale(1.5);
    }
  }

   /* LOSER OVERLAY */
  #loserOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.6);
    z-index: 5000; /* lowered */
    font-size: 5em;
    font-weight: bold;
    text-align: center;
    pointer-events: none; /* allows clicks through overlay */
  }

  /* continuous shake for overlay text */
  .overlay-shake {
    animation: overlayShake 0.2s infinite;
  }

  @keyframes overlayShake {
    0% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(3px,-3px) rotate(1deg); }
    50% { transform: translate(-3px,3px) rotate(-1deg); }
    75% { transform: translate(3px,3px) rotate(1deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  
  #restart {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 6000;
    margin-top: 0;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #ff6b6b;
    color: white;
    cursor: pointer;
  }

  #mainMenuBtn {
    position: fixed;
    bottom: 30px;
    right: 200px;
    z-index: 6000;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #4dabf7;
    color: white;
    cursor: pointer;
    font-size: 1em;
    transition: background 0.2s;
  }

  #mainMenuBtn:hover {
    background: #339af0;
  }

  .status-indicator {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
  }

  .status-online {
    background: #51cf66;
    box-shadow: 0 0 10px #51cf66;
  }

  .status-offline {
    background: #ff6b6b;
    box-shadow: 0 0 10px #ff6b6b;
  }

  .player-card {
    background: rgba(255,255,255,0.15);
    padding: 12px;
    border-radius: 8px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .host-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 15px 0;
  }

  .btn-kick {
    background: #ff6b6b;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9em;
  }

  .btn-kick:hover {
    background: #ee5a52;
  }

  .spectator-list {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    margin-top: 15px;
    font-size: 0.9em;
  }

  #spectatorMode {
    background: rgba(100,200,255,0.3);
    padding: 15px;
    border-radius: 8px;
    margin: 15px 0;
    border: 2px dashed #4dabf7;
  }

  .card {
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 15px;
    display: inline-block;
  }
</style>
<link rel="stylesheet" href="/themes.css">
</head>
<body>

<div id="loserOverlay" class="overlay-shake">
  YOU ARE A FUCKING LOSER
</div>

<div class="game-container">
  <div class="card">
    <h1>Online Game</h1>
    <div id="gameIdDisplay"></div>
    <div id="playerStatus"></div>
    <div id="spectatorMode"></div>
    <div id="hostControls" style="display:none;"></div>
    <h2 id="status"></h2>

    <div class="grid" id="grid"></div>

    <div id="spectatorList"></div>

    <button id="restart" style="display:none;">Restart Game</button>
    <button id="mainMenuBtn">Main Menu</button>
  </div>
</div>

<div class="sidebar">
  <h2>🏆 Leaderboard</h2>
  <table class="leaderboard-table" id="leaderboardTable">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>W-D-L</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody">
      <tr><td colspan="3" style="text-align: center;">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>

  document.getElementById('mainMenuBtn').addEventListener('click', () => {

</script>
<script src="/theme-loader.js"></script>

</body>
</html>
